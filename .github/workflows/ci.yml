name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time only. Real secrets come from the deploy environment.
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: Fly Ash Bricks
      SKIP_ENV_VALIDATION: 'true'
      # Skipped validation also skips the schema's defaults; the logger needs a level.
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test -- --coverage
      - run: pnpm build
      - run: pnpm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The gitleaks CLI image rather than gitleaks-action, which needs a paid
      # licence for repositories owned by an organisation.
      - name: Scan history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1

  # Builds the production images and fails on any HIGH or CRITICAL
  # vulnerability that already has a fix available.
  image-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runner
          build-args: NEXT_PUBLIC_APP_URL=https://bricks.example.com
          tags: fly-ash-bricks:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/scheduler.Dockerfile
          tags: fly-ash-bricks-scheduler:ci
          load: true
      - name: Scan app image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fly-ash-bricks:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan scheduler image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: fly-ash-bricks-scheduler:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: validate
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_NAME: Fly Ash Bricks
      AUTH_SECRET: ci-only-secret-value-at-least-32-characters-long
      AUTH_TRUST_HOST: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/flyash?directConnection=true
      CRON_SECRET: ci-only-cron-secret-value
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A single-node replica set: sales and production run in transactions,
      # which a plain service container (no --replSet) cannot provide.
      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }" && break
            sleep 2
          done
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
