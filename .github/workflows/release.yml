name: Release

# Pushing a tag vX.Y.Z builds the archive servers install, for x64 and arm64,
# and publishes them as a GitHub release. Servers set up with
# deploy/proxmox/setup.sh offer the newest release on the app's Updates page,
# with these notes. Tag a commit on main once its CI run is green.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Native modules (sharp) come from the machine that builds.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/package-release.sh
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: release-${{ matrix.runner }}
          path: dist/*.tar.gz*
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # Notes are the commit subjects since the previous release, which is
        # what the Updates page shows before an admin installs it.
        run: |
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          git log --no-merges --pretty='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.tar.gz.sha256 \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
