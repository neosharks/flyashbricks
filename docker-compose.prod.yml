# Self-hosted production: one machine, everything in containers.
#
#   cp deploy/.env.production.example .env.production   # fill in secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
#
# .env.production is read by Compose alone, to fill in the ${...} below. No
# container gets the whole file: each one is handed only the values it needs,
# so the app never holds the MongoDB root password and Redis never sees the
# app's secrets.
#
# Only Caddy publishes ports. MongoDB and Redis sit on an internal network
# with authentication on — never exposed to the internet, and with no route
# out to it either.
#
# Images are pinned to a minor release and updated deliberately. To pin to
# the exact build you tested, replace a tag with its digest:
#   docker pull caddy:2.11-alpine && docker inspect --format '{{index .RepoDigests 0}}' caddy:2.11-alpine
name: fly-ash-bricks

x-logging: &logging
  driver: json-file
  options: { max-size: 10m, max-file: '5' }

x-hardening: &hardening
  read_only: true
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]

services:
  caddy:
    image: caddy:2.11-alpine
    <<: *hardening
    restart: unless-stopped
    ports: ['80:80', '443:443', '443:443/udp']
    # Root inside the container only to bind 80/443; nothing else is granted.
    cap_add: [NET_BIND_SERVICE]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: ['/tmp']
    networks: [frontend]
    depends_on: [app]
    logging: *logging

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fly Ash Bricks}
    <<: *hardening
    restart: unless-stopped
    init: true
    # Every variable the app reads, and nothing else (see lib/env-schema.ts).
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Fly Ash Bricks}
      MONGODB_URI: mongodb://${MONGO_APP_USER:?set MONGO_APP_USER}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/${MONGODB_DB_NAME:-flyash}?replicaSet=rs0&authSource=admin
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-flyash}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AUTH_URL: https://${APP_DOMAIN}
      AUTH_TRUST_HOST: 'true'
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
      # Caddy overwrites X-Forwarded-For; raise only if another proxy sits in front of it.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      MAIL_FROM: ${MAIL_FROM:?set MAIL_FROM}
      SMTP_URL: ${SMTP_URL:-}
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_EMAIL_TO: ${BACKUP_EMAIL_TO:-}
      STORAGE_DIR: /data/assets
      ASSET_MAX_UPLOAD_MB: ${ASSET_MAX_UPLOAD_MB:-8}
      ASSET_ORG_QUOTA_MB: ${ASSET_ORG_QUOTA_MB:-2048}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-}
      SMS_WEBHOOK_SECRET: ${SMS_WEBHOOK_SECRET:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-none}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_SECRET: ${WHATSAPP_WEBHOOK_SECRET:-}
    volumes:
      - backups:/backups
      - assets:/data/assets
    mem_limit: 1g
    tmpfs: ['/tmp', '/app/.next/cache:uid=1001,gid=1001']
    # frontend: Caddy in, mail and SMS gateways out. backend: database and cache.
    networks: [frontend, backend, cron]
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *logging

  # One-off: index sync and data migrations, run before each rollout. Also
  # runs the admin scripts (org:create, backup:restore).
  migrate:
    build: { context: ., target: tools }
    profiles: ['tools']
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    environment:
      MONGODB_URI: mongodb://${MONGO_APP_USER:?set MONGO_APP_USER}:${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}@mongo:27017/${MONGODB_DB_NAME:-flyash}?replicaSet=rs0&authSource=admin
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-flyash}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    networks: [backend]
    depends_on:
      mongo: { condition: service_healthy }
    logging: *logging

  # Drives the scheduled endpoints. A separate tiny container rather than a
  # timer inside the app, so a slow job can never stall web requests. Its
  # network reaches the app and nothing else.
  scheduler:
    build: { context: ., dockerfile: deploy/scheduler.Dockerfile }
    <<: *hardening
    restart: unless-stopped
    environment:
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET}
    networks: [cron]
    depends_on: [app]
    logging: *logging

  mongo:
    image: mongo:8.2
    <<: *hardening
    restart: unless-stopped
    # The image's own user; the data volume and keyfile are already owned by it.
    user: '999:999'
    command: ['--replSet', 'rs0', '--bind_ip_all', '--keyFile', '/etc/mongo/keyfile', '--auth']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
      MONGO_APP_USER: ${MONGO_APP_USER:?set MONGO_APP_USER}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?set MONGO_APP_PASSWORD}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-flyash}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./deploy/mongo-keyfile:/etc/mongo/keyfile:ro
      - ./deploy/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
      - ./deploy/mongo-healthcheck.js:/etc/mongo/healthcheck.js:ro
    tmpfs: ['/tmp:uid=999,gid=999']
    networks: [backend]
    healthcheck:
      # Reads the root credentials from the environment, so they never appear
      # in a process listing; also initiates the replica set on first start.
      test: ['CMD', 'mongosh', '--quiet', '--nodb', '--file', '/etc/mongo/healthcheck.js']
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 20s
    logging: *logging

  redis:
    image: redis:7.4-alpine
    <<: *hardening
    restart: unless-stopped
    # The image's own user (redis:redis); the data volume is already owned by it.
    user: '999:1000'
    # The password goes in a config file on a private tmpfs, not on the
    # command line where any process listing would show it. printf is a shell
    # builtin, so it never appears there either.
    entrypoint: ['/bin/sh', '-c']
    command:
      - umask 077 && printf 'appendonly yes\nrequirepass "%s"\n' "$$REDISCLI_AUTH" > /tmp/redis.conf && exec redis-server /tmp/redis.conf
    environment:
      # redis-cli reads this, so the healthcheck needs no -a argument.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    volumes: ['redis-data:/data']
    tmpfs: ['/tmp:uid=999,gid=1000,mode=0700']
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *logging

networks:
  frontend:
  backend:
    internal: true
  cron:
    internal: true

volumes:
  caddy-data:
  caddy-config:
  mongo-data:
  mongo-config:
  redis-data:
  backups:
  assets:
