# Local development stack: MongoDB (single-node replica set) and Redis.
# `docker compose up -d`, then `pnpm setup && pnpm dev`.
services:
  # Single-node replica set: sales and production write stock, money and the
  # audit log in one transaction, and transactions require a replica set.
  #
  # No authentication, deliberately: the port is bound to loopback and this is
  # for local development only. docker-compose.prod.yml runs with auth.
  mongo:
    image: mongo:8.2
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['127.0.0.1:${MONGO_PORT:-27017}:27017']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Doubles as the initiator: the first successful check promotes the node.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 5s

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:${REDIS_PORT:-6379}:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
  redis-data:
